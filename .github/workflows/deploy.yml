name: 🚀 Deploy to DigitalOcean

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Bilscore to DigitalOcean
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to Droplet
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: 104.248.165.128
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            APP_DIR="/var/www/bilscore"
            REPO_URL="https://github.com/mybilscore/Billscore-.git"
            
            if [ -d "$APP_DIR" ]; then
              echo "📦 Pulling latest code..."
              cd $APP_DIR
              git pull
            else
              echo "📦 Cloning repository..."
              git clone $REPO_URL $APP_DIR
              cd $APP_DIR
            fi
            
            echo "📦 Installing dependencies..."
            npm install
            
            echo "🔧 Generating Prisma client..."
            npx prisma generate
            
            echo "🗄️ Running database migrations..."
            npx prisma migrate deploy || echo "⚠️ Migration skipped"
            
            echo "🏗️ Building app..."
            
            # ✅ FIX 1: Load env vars before build
            export NEXTAUTH_URL="https://app.bilscore.com"
            export NEXT_PUBLIC_APP_URL="https://app.bilscore.com"
            
            npm run build
            
            # ✅ FIX 2: Stop deployment if build failed
            if [ ! -d ".next" ] || [ ! -f ".next/BUILD_ID" ]; then
              echo "❌ Build failed! Stopping deployment."
              exit 1
            fi
            
            echo "🔄 Restarting app..."
            if pm2 list | grep -q "bilscore"; then
              pm2 restart bilscore
            else
              pm2 start npm --name "bilscore" -- start
            fi
            
            pm2 save
            
            echo "✅ Deployment complete!"
            echo "🌐 App running at: https://app.bilscore.com"