name: 🚀 Deploy to DigitalOcean

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Bilscore to DigitalOcean
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to Droplet
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: 104.248.165.128
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            APP_DIR="/var/www/bilscore"
            REPO_URL="https://github.com/mybilscore/Billscore-.git"
            
            # ─── Clone or Pull ───
            if [ -d "$APP_DIR" ]; then
              echo "📦 Pulling latest code..."
              cd $APP_DIR
              git pull
            else
              echo "📦 Cloning repository..."
              git clone $REPO_URL $APP_DIR
              cd $APP_DIR
            fi
            
            # ───  REMOVED: .env creation - using existing .env on droplet
            
            # ─── Install Dependencies ───
            echo " Installing dependencies..."
            npm install
            
            # ─── Generate Prisma Client ───
            echo " Generating Prisma client..."
            npx prisma generate
            
            # ─── Run Database Migrations ───
            echo " Running database migrations..."
            npx prisma migrate deploy || echo "⚠️ Migration skipped"
            
            # ─── Build App ───
            echo " Building app..."
            npm run build
            
            # ─── Restart App with PM2 ───
            echo " Restarting app..."
            if pm2 list | grep -q "bilscore"; then
              pm2 restart bilscore
            else
              pm2 start npm --name "bilscore" -- start
            fi
            
            # ─── Save PM2 Configuration ───
            pm2 save
            
            echo "✅ Deployment complete!"
            echo "🌐 App running at: https://app.bilscore.com"